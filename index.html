<!DOCTYPE html>
<html lang="en">

<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vanity Blue</title>

  <link rel="stylesheet" href="./style.css?v=2">
</head>

<body>

  <main>

    <section>
      <h1>VANITY<br>BLUE</h1>

      <p class="tagline">
        Independent radio from Durham.<br>
        Broadcasting outward from the North East.
      </p>
    </section>

    <section class="footer">
      <span>Durham, UK</span>
      <span>Est. 2026</span>
    </section>

  </main>

  <section class="latest">

  <div class="section-label">
    <span>LATEST BROADCAST</span>
    <span>001</span>
  </div>

  <div class="latest-grid">

    <div class="show-artwork">
      <span>VB001</span>
    </div>

    <div class="show-info">

      <p class="show-number">VB001</p>

      <h2>OPENING<br>TRANSMISSION</h2>

      <p class="show-description">
        The first transmission from Vanity Blue.
        Independent music from Durham and beyond.
      </p>

      <div class="show-meta">
        <span>60 MIN</span>
        <span>DURHAM, UK</span>
        <span>2026</span>
      </div>

      <span class="listen-button">COMING SOON</span>

    </div>

  </div>

</section>
  
</body>

</html>
